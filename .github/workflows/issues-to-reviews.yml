- name: Checkout cod
        uses: actions/checkout@v4
        with:
          persist-credentials: false # Previne suprascrierea credentialelor de catre checkout

      - name: Setează Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Procesează textul din Issue
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node process-reviews.js

      - name: Commit & Push în GitHub Pages
        run: |
          git config --global user.name "GitHub Review Bot"
          git config --global user.email "bot@github.com"
          
          # Autentificare directa folosind GITHUB_TOKEN nativ cu drepturi explicite
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add reviews.json
          git commit -m "Adaugat recenzie din Issue #${{ github.event.issue.number }}"
          git push origin HEAD:main
