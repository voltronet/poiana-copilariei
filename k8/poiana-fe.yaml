apiVersion: apps/v1
kind: Deployment
metadata:
  name: poiana-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poiana-copilariei
  template:
    metadata:
      labels:
        app: poiana-copilariei
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: poiana-service
  namespace: default
spec:
  selector:
    app: poiana-copilariei
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
